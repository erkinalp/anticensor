<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OMRC Recommender</title>
  <style>
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
    }
    .section {
      margin-bottom: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .section-title {
      font-weight: bold;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .omrc-content {
      font-size: 13px;
      line-height: 1.4;
    }
    .recommendation-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    .recommendation-item:last-child {
      border-bottom: none;
    }
    .rec-title {
      font-weight: bold;
      font-size: 13px;
      color: #2c3e50;
      text-decoration: none;
    }
    .rec-meta {
      font-size: 11px;
      color: #7f8c8d;
      margin-top: 2px;
    }
    .score {
      display: inline-block;
      padding: 2px 4px;
      background: #e0f7fa;
      color: #006064;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 5px;
    }
    #loading {
      text-align: center;
      color: #666;
      padding: 20px;
      display: none;
    }
    .error {
      color: #d32f2f;
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="current-paper" class="section">
    <div class="section-title">Current Paper Analysis (OMRC)</div>
    <div id="omrc-display" class="omrc-content">Select a paper in Zotero to analyze.</div>
  </div>

  <div id="recommendations" class="section">
    <div class="section-title">Recommended Papers</div>
    <div id="loading">Analyzing and fetching recommendations...</div>
    <div id="error-msg" class="error"></div>
    <div id="rec-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
